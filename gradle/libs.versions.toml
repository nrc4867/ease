[versions]
kotlin = "2.4.21"
jvmToolchain = "25"
kotlinx-coroutines = "1.11.0"
webgpu-native-ffm = "0.1.0"
lwjgl = "3.4.3"
compose = "1.12.2"
junit = "6.1.3"
konsist = "1.0.0-beta.1"
spotless = "8.12.0"
ktfmt = "0.64"
google-java-format = "2.0.0"
detekt = "2.0.0-alpha.6"
fleks = "2.16"
kotlinx-serialization = "1.13.0"
jmh = "0.7.4"

[libraries]
webgpu-native-ffm = { module = "dev.chieppa:webgpu-native-ffm", version.ref = "webgpu-native-ffm" }
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
lwjgl-sdl = { module = "org.lwjgl:lwjgl-sdl", version.ref = "lwjgl" }
fleks = { module = "io.github.quillraven.fleks:Fleks", version.ref = "fleks" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
# The build logic's own plugins, put on its classpath so the convention plugins can apply them.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# A build tool only (JMH is GPL with the classpath exception): never on a shipped classpath.
jmh = { id = "me.champeau.jmh", version.ref = "jmh" }
