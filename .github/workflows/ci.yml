name: CI

# The checks main requires. Stretch is checked out beside Ease, where the composite build finds it.
# A pull request that changes only Markdown skips the code jobs, which then pass.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  STRETCH_REF: main
  # wgpu-native's bindings come from GitHub Packages, which needs a token even for public packages.
  ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
  ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # code=false only on a pull request whose changed files are all Markdown. When this job fails its
  # output is empty, so every job below runs in full.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            tools/ci-changed-code.sh "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Formatting, detekt, checkSources, the build logic's tests, unit and architecture tests.
  check:
    name: Checks and tests
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: ease
      - uses: actions/checkout@v7
        with:
          repository: nrc4867/stretch
          ref: ${{ env.STRETCH_REF }}
          path: stretch
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew check --continue
        working-directory: ease
      # The sample as the player runs it, headless: no window, no GPU, its input script attached,
      # from its saved scene.
      - run: ./gradlew :sample:sampleHeadless
        working-directory: ease
      # ease check on the sample's own content, as a game's pre-commit hook runs it.
      - run: ./gradlew :ease-cli:runEase --args="check --dir sample"
        working-directory: ease
      # ease import on the sample's content: the sample's own palette importer runs headless.
      - run: ./gradlew :sample:sampleImport
        working-directory: ease
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: check-reports
          path: |
            ease/**/build/reports
            ease/**/build/test-results

  # The *GpuTest tests on real wgpu over Mesa's software Vulkan driver, lavapipe, and the smoke apps
  # that open windows, under a virtual X server.
  gpu:
    name: GPU tests (lavapipe)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: ease
      - uses: actions/checkout@v7
        with:
          repository: nrc4867/stretch
          ref: ${{ env.STRETCH_REF }}
          path: stretch
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools xvfb
          vulkaninfo --summary
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew gpuTest --continue
        working-directory: ease
      - run: xvfb-run -a ./gradlew :ease-platform:windowSmoke :sample:sampleSmoke
        working-directory: ease
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gpu-test-reports
          path: |
            ease/**/build/reports/tests
            ease/**/build/test-results

  # Builds, loads this platform's natives, runs the unit tests and the smoke apps that open windows on
  # the other two desktops.
  platforms:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          path: ease
      - uses: actions/checkout@v7
        with:
          repository: nrc4867/stretch
          ref: ${{ env.STRETCH_REF }}
          path: stretch
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assemble test --continue
        working-directory: ease
        shell: bash
      - run: ./gradlew :ease-platform:windowSmoke
        working-directory: ease
        shell: bash
      # Windows runners have no GPU adapter, so the player draws the sample only on macOS here and
      # on Linux in the lavapipe job.
      - if: matrix.os == 'macos-latest'
        run: ./gradlew :sample:sampleSmoke
        working-directory: ease
        shell: bash

  # A game generated from every project template (and one of every generator added to it), built
  # against this checkout as a composite build, with its formatting, rules and first tests.
  templates:
    name: Project templates
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: ease
      - uses: actions/checkout@v7
        with:
          repository: nrc4867/stretch
          ref: ${{ env.STRETCH_REF }}
          path: stretch
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: bash tools/check-templates.sh "$RUNNER_TEMP/templates"
        working-directory: ease

  # The one check main's ruleset requires: green when the changed files were read and every code job
  # passed, or was skipped for a Markdown-only change.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, check, gpu, platforms, templates]
    if: always()
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ needs.check.result }} ${{ needs.gpu.result }} ${{ needs.platforms.result }} ${{ needs.templates.result }}
        run: |
          echo "changes $CHANGES, code '$CODE', jobs $RESULTS"
          test "$CHANGES" = success
          # Explicit exits: bash -e does not stop on a failure inside an || or && list.
          for result in $RESULTS; do
            if [ "$result" = success ]; then continue; fi
            if [ "$CODE" = false ] && [ "$result" = skipped ]; then continue; fi
            echo "A required job ended $result"
            exit 1
          done
